<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porodica Spasić — D2</title>
<style>
:root {
  --bg:#f3f5f7; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#a7adb6;
  --male:#2f5496; --female:#c33764; --focus:#d97706;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:1180px;margin:0 auto;padding:10px 10px 36px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(243,245,247,.96);backdrop-filter:blur(10px);padding:6px 0 10px}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.searchbox{position:relative;width:min(420px,100%)}
.search{width:100%;min-height:44px;border:1px solid #cfd4dc;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
.results{display:none;position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid #d1d5db;border-radius:10px;max-height:320px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:60}
.result{width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;border-bottom:1px solid #eee;min-height:44px}

.branchbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.branch{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:9px 10px;min-height:44px;font-size:12px;font-weight:700}
.branch:first-child{text-align:left} .branch:last-child{text-align:right}
.branch:disabled{opacity:.35}

.generation{scroll-margin-top:104px;margin:0 auto 20px;padding:0 0 8px;transform-origin:center center;transition:transform .22s ease,opacity .22s ease,filter .22s ease}
.generation.focus-gen{transform:scale(1);opacity:1;filter:none}
.generation.near-gen{transform:scale(.95);opacity:.86;filter:saturate(.9)}
.generation.far-gen{transform:scale(.89);opacity:.64;filter:saturate(.78)}
.gen-label{text-align:center;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:8px 0}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:flex-start}
.connector{width:2px;height:24px;background:var(--line);margin:0 auto}
.children{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.children .card{flex:0 0 205px;scroll-snap-align:center}
.children.few{justify-content:center;overflow:visible;flex-wrap:wrap}

.card{width:210px;min-height:78px;border:0;border-left:5px solid #888;border-radius:12px;background:#fff;padding:9px 10px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card.m{border-left-color:var(--male)} .card.f{border-left-color:var(--female)}
.card.selected{outline:3px solid #f0b35f;box-shadow:0 5px 18px rgba(0,0,0,.14)}
.photo,.avatar{width:48px;height:48px;border-radius:50%;flex:0 0 48px;object-fit:cover;background:#e5e7eb}
.avatar{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
.avatar.m{background:var(--male)} .avatar.f{background:var(--female)}
.name{font-size:13px;font-weight:800;line-height:1.15}
.dates{font-size:12px;color:var(--muted);margin-top:4px}
.role{font-size:11px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:#9ca3af;font-size:13px;padding:8px}

.details{background:#fff;border-radius:12px;padding:13px 14px;box-shadow:0 1px 6px rgba(0,0,0,.06);max-width:840px;margin:6px auto 20px}
.details h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.lab{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.val{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.notes{grid-column:1/-1}

@media(max-width:700px){
 .app{padding:8px 8px 28px}
 .head{display:block} .searchbox{width:100%;margin-top:8px}
 .card{width:min(240px,calc(50vw - 16px));min-width:145px}
 .row.parents .card,.row.couple .card{width:calc(50% - 5px);min-width:0}
 .children .card{flex-basis:82vw;max-width:300px}
 .grid{grid-template-columns:1fr} .notes{grid-column:auto}
}
</style>
</head>

<div class="app">

  <main id="tree"></main>
  <section id="details" class="details"></section>
</div>

 "@I63@"]}, {"id": "@F500006@", "husband": "@I500036@", "wife": "@I500037@", "marriage": "1891-11-26", "marriageplace": "St Bridets, Simpson, Minn", "children": ["@I500043@", "@I500042@", "@I500035@"]}, {"id": "@F500007@", "husband": "@I500040@", "wife": "@I500041@", "marriage": "1838-07-04", "marriageplace": "", "children": ["@I500047@", "@I500048@", "@I500036@", "@I500051@", "@I500052@", "@I500049@", "@I500050@"]}, {"id": "@F500008@", "husband": "@I500038@", "wife": "@I500045@", "marriage": "", "marriageplace": "", "children": ["@I500044@"]}, {"id": "@F500009@", "husband": "@I500046@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I500040@"]}, {"id": "@F500010@", "husband": "@I500042@", "wife": "@I500053@", "marriage": "1933", "marriageplace": "", "children": []}, {"id": "@F500011@", "husband": "@I500054@", "wife": "@I500043@", "marriage": "1908", "marriageplace": "", "children": []}, {"id": "@F500012@", "husband": "@I500055@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I500046@"]}, {"id": "@F500013@", "husband": "@I500056@", "wife": "@I500047@", "marriage": "1867-12-01", "marriageplace": "St. Bridets Church, Simpson, Minn", "children": ["@I500058@", "@I500057@", "@I500059@", "@I500060@", "@I500061@"]}, {"id": "@F500014@", "husband": "@I500050@", "wife": "@I500062@", "marriage": "1876", "marriageplace": "", "children": ["@I500063@", "@I500064@", "@I500065@", "@I500066@"]}, {"id": "@F500015@", "husband": "@I500067@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I500055@"]}, {"id": "@F500016@", "husband": "@I500068@", "wife": "@I500069@", "marriage": "1828", "marriageplace": "", "children": ["@I500056@"]}, {"id": "@F500017@", "husband": "@I500057@", "wife": "@I500070@", "marriage": "1895-08-13", "marriageplace": "", "children": ["@I500073@", "@I500072@", "@I500074@", "@I500071@"]}, {"id": "@F500018@", "husband": "@I500058@", "wife": "@I500075@", "marriage": "1902-10-15", "marriageplace": "", "children": []}, {"id": "@F500105@", "husband": "@I500135@", "wife": "@I16@", "marriage": "2015-08-22", "marriageplace": "", "children": ["@I500160@"]}, {"id": "@F500106@", "husband": "@I500135@", "wife": "@I500136@", "marriage": "2015-08-22", "marriageplace": "Čikago", "children": []}, {"id": "@F500111@", "husband": "@I500141@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I70@"]}, {"id": "@F500112@", "husband": "@I500142@", "wife": "@I15@", "marriage": "2016-03-30", "marriageplace": "", "children": ["@I500153@"]}, {"id": "@F500113@", "husband": "@I500145@", "wife": "@I500158@", "marriage": "", "marriageplace": "", "children": ["@I22@"]}, {"id": "@F500114@", "husband": "@I500147@", "wife": "@I500148@", "marriage": "", "marriageplace": "", "children": ["@I32@"]}, {"id": "@F500117@", "husband": "@I500152@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I500141@"]}, {"id": "@F500119@", "husband": "@I500162@", "wife": "@I500163@", "marriage": "", "marriageplace": "", "children": ["@I160@", "@I500164@"]}, {"id": "@F500120@", "husband": "@I160@", "wife": "@I500166@", "marriage": "", "marriageplace": "", "children": []}, {"id": "@F500121@", "husband": "@I500167@", "wife": "@I500168@", "marriage": "", "marriageplace": "", "children": ["@I125@"]}, {"id": "@F500122@", "husband": "@I500172@", "wife": "", "marriage": "", "marriageplace": "", "children": ["@I500007@"]}, {"id": "@F500123@", "husband": "@I500173@", "wife": "@I500174@", "marriage": "", "marriageplace": "", "children": ["@I500162@", "@I500176@"]}, {"id": "@F500124@", "husband": "@I160@", "wife": "@I500177@", "marriage": "", "marriageplace": "", "children": ["@I500178@"]}, {"id": "@F500125@", "husband": "@I140@", "wife": "@I500179@", "marriage": "", "marriageplace": "", "children": []}, {"id": "@F500126@", "husband": "@I500180@", "wife": "@I146@", "marriage": "2020-09-05", "marriageplace": "Pelican Lake, MN", "children": ["@I500182@"]}, {"id": "@F500127@", "husband": "@I500181@", "wife": "@I19@", "marriage": "2020-10-01", "marriageplace": "Minneapolis, MN", "children": []}];
const BASE="https://pipilipi.github.io/FamilyTree/";
const personById=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const familyById=Object.fromEntries(FAMILIES.map(f=>[f.id,f]));
const spouseFamilies={}, parentFamily={};
for(const f of FAMILIES){
  for(const id of [f.husband,f.wife]) if(id) (spouseFamilies[id] ||= []).push(f.id);
  for(const c of f.children||[]) if(c) parentFamily[c]=f.id;
}

let selectedId=personById["@I1@"]?"@I1@":PEOPLE[0]?.id;
let path=[selectedId];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function y(v){return v?String(v).slice(0,4):""}
function years(p){const b=y(p?.birth),d=y(p?.death);return b||d?`${b||"?"}${d?" – "+d:""}`:""}
function imgUrl(p){return p?.photo?BASE+encodeURIComponent(p.photo):""}

function card(id,role="",selected=false){
  const p=personById[id]; if(!p)return "";
  const cls=p.gender==="F"?"f":"m"; const initial=esc((p.name||"?").trim().charAt(0).toUpperCase());
  const photo=p.photo
    ? `<img class="photo" src="${imgUrl(p)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="avatar ${cls}" style="display:none">${initial}</span>`
    : `<span class="avatar ${cls}">${initial}</span>`;
  return `<button class="card ${cls} ${selected?"selected":""}" data-person="${esc(id)}">${photo}<span><div class="name">${esc(p.name)}</div><div class="dates">${esc(years(p))}</div>${role?`<div class="role">${esc(role)}</div>`:""}</span></button>`;
}

function rel(id){
  const pf=parentFamily[id]?familyById[parentFamily[id]]:null;
  const father=pf?.husband&&personById[pf.husband]?pf.husband:"";
  const mother=pf?.wife&&personById[pf.wife]?pf.wife:"";
  const unions=(spouseFamilies[id]||[]).map(fid=>{
    const f=familyById[fid];
    const spouse=f.husband===id?f.wife:f.husband;
    return {f,spouse:spouse&&personById[spouse]?spouse:"",children:(f.children||[]).filter(c=>personById[c])};
  });
  return {father,mother,unions};
}

function pairOrder(id, spouseId, f){
  if(!spouseId) return [id];
  // Stable within a family: husband left, wife right when data says so.
  if(f.husband && f.wife) return [f.husband,f.wife].filter(x=>personById[x]);
  return [id,spouseId];
}

function blockFor(id,index){
  const r=rel(id);
  const nextId = path[index+1] || "";
  let h=`<section class="generation" id="gen-${index}" data-focus-id="${esc(id)}">`;
  h+=`<div class="gen-label">${index===0?"Početak":"Generacija "+(index+1)}</div>`;

  if(index===0){
    h+=`<div class="gen-label">Roditelji</div><div class="row parents">`;
    h+=r.father?card(r.father,"Otac"):"";
    h+=r.mother?card(r.mother,"Majka"):"";
    if(!r.father&&!r.mother)h+=`<div class="empty">Nema upisanih roditelja</div>`;
    h+=`</div><div class="connector"></div>`;
  }

  if(!r.unions.length){
    h+=`<div class="row couple">${card(id,"",true)}</div>`;
    h+=`<div class="connector"></div><div class="gen-label">Deca</div><div class="empty">Nema upisane dece</div>`;
  } else {
    r.unions.forEach((u,ui)=>{
      const ordered=pairOrder(id,u.spouse,u.f);
      h+=`<div class="row couple">`+
        ordered.map(pid=>card(pid,pid===id?"":"Bračni drug",pid===id)).join("")+
        `</div>`;

      h+=`<div class="connector"></div><div class="gen-label">Deca</div>`;

      // If one of these children is the next focus, don't draw it here again.
      // It will appear exactly once, as the main person in the next generation.
      const visibleChildren = u.children.filter(cid => cid !== nextId);

      if(visibleChildren.length){
        const c=visibleChildren.length<=3?"children few":"children";
        h+=`<div class="${c}">`+visibleChildren.map(cid=>card(cid)).join("")+`</div>`;
      } else if(!nextId){
        h+=`<div class="empty">Nema upisane dece</div>`;
      }

      if(nextId && u.children.includes(nextId)){
        h+=`<div class="connector"></div>`;
      }

      if(ui<r.unions.length-1) h+=`<div style="height:14px"></div>`;
    });
  }}
  h+=`</section>`;
  return h;
}


function updateGenerationFocus(){
  const sections=[...document.querySelectorAll(".generation")];
  if(!sections.length) return;
  const target=window.innerHeight*0.47;
  let best=0, bestDist=Infinity;
  sections.forEach((s,i)=>{
    const r=s.getBoundingClientRect();
    const c=r.top+r.height/2;
    const d=Math.abs(c-target);
    if(d<bestDist){bestDist=d;best=i}
  });
  sections.forEach((s,i)=>{
    s.classList.remove("focus-gen","near-gen","far-gen");
    const gap=Math.abs(i-best);
    s.classList.add(gap===0?"focus-gen":gap===1?"near-gen":"far-gen");
  });
}

function render(){
  document.getElementById("tree").innerHTML=path.map((id,i)=>blockFor(id,i)).join("");
  document.querySelectorAll("[data-person]").forEach(el=>el.addEventListener("click",()=>choose(el.dataset.person)));
  updateBranchButtons();
  renderDetails(personById[selectedId]);
  requestAnimationFrame(updateGenerationFocus);
}

function choose(id){
  if(!personById[id])return;

  const existing=path.indexOf(id);

  if(existing>=0){
    // Going back/up: keep only the route up to that person.
    path=path.slice(0,existing+1);
    selectedId=id;
    render();
    requestAnimationFrame(()=>{
      document.getElementById(`gen-${existing}`)?.scrollIntoView({behavior:"smooth",block:"start"});
    });
    return;
  }

  selectedId=id;

  // If the clicked person is a child of the current focus, continue downward.
  const current=path[path.length-1];
  const currentRel=rel(current);
  const isChild=currentRel.unions.some(u=>u.children.includes(id));

  if(isChild){
    path.push(id);
  } else {
    // Parent, spouse, sibling, or search-like jump: start a clean route from that person.
    path=[id];
  }

  render();
  const idx=path.length-1;
  requestAnimationFrame(()=>{
    document.getElementById(`gen-${idx}`)?.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

function updateBranchButtons(){
  const r=rel(selectedId), fb=document.getElementById("fatherBtn"), mb=document.getElementById("motherBtn");
  fb.disabled=!r.father; mb.disabled=!r.mother;
  fb.textContent=r.father?`← ${personById[r.father].name}`:"← Očeva grana";
  mb.textContent=r.mother?`${personById[r.mother].name} →`:"Majčina grana →";
  fb.onclick=()=>r.father&&choose(r.father);
  mb.onclick=()=>r.mother&&choose(r.mother);
}

function renderDetails(p){
  const box=document.getElementById("details");
  const birth=[p.birth,p.birthplace].filter(Boolean).join(" · ")||"—";
  const death=[p.death,p.deathplace].filter(Boolean).join(" · ");
  box.innerHTML=`<h2>${esc(p.name)}</h2><div class="grid">
    <div><div class="lab">Rođenje</div><div class="val">${esc(birth)}</div></div>
    ${death?`<div><div class="lab">Smrt</div><div class="val">${esc(death)}</div></div>`:""}
    ${p.email?`<div><div class="lab">Email</div><div class="val">${esc(p.email)}</div></div>`:""}
    ${p.notes?`<div class="notes"><div class="lab">Beleške</div><div class="val">${esc(p.notes)}</div></div>`:""}
  </div>`;
}

const search=document.getElementById("search"),results=document.getElementById("results");
search.addEventListener("input",()=>{
  const q=search.value.trim().toLocaleLowerCase("sr");
  if(!q){results.style.display="none";results.innerHTML="";return}
  const hits=PEOPLE.filter(p=>p.name.toLocaleLowerCase("sr").includes(q)).slice(0,30);
  results.innerHTML=hits.map(p=>`<button class="result" data-search="${esc(p.id)}">${esc(p.name)}${years(p)?" ("+esc(years(p))+")":""}</button>`).join("");
  results.style.display=hits.length?"block":"none";
  results.querySelectorAll("[data-search]").forEach(b=>b.addEventListener("click",()=>{
    search.value=personById[b.dataset.search].name;
    results.style.display="none";
    path=[b.dataset.search]; selectedId=b.dataset.search; render(); window.scrollTo({top:0,behavior:"smooth"});
  }));
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchbox"))results.style.display="none"});
window.addEventListener("scroll",updateGenerationFocus,{passive:true});
window.addEventListener("resize",updateGenerationFocus);
render();
</script>
